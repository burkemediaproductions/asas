[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  SERVICEUP_API_BASE = "https://serviceup-shared-api.onrender.com"
  SITE_URL = "https://asasresearch.org"

[[headers]]
  for = "/legacy-reference-2026/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
